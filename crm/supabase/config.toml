# GUIMAES — Configuración de la CLI de Supabase (solo para desplegar Edge Functions)
# La fuente de verdad del código de las funciones es crm/supabase-functions/.
# Este archivo solo le dice a la CLI dónde encontrar el index.ts de cada una.
#
# Nota sobre las rutas: aunque la documentación de Supabase dice que "entrypoint"
# es relativo a la raíz del proyecto, en la práctica (CLI 2.109.1) se resuelve
# relativo a esta carpeta (crm/supabase/) — de ahí el "../" en cada ruta.
project_id = "guimaes"

[functions.admin-users]
entrypoint = "../supabase-functions/admin-users/index.ts"

[functions.notify-new-lead]
entrypoint = "../supabase-functions/notify-new-lead/index.ts"

[functions.whatsapp-webhook]
entrypoint = "../supabase-functions/whatsapp-webhook/index.ts"
verify_jwt = false

[functions.whatsapp-send]
entrypoint = "../supabase-functions/whatsapp-send/index.ts"
verify_jwt = true  # explícito: la llama el CRM autenticado, a diferencia del webhook

[functions.whatsapp-sync-templates]
entrypoint = "../supabase-functions/whatsapp-sync-templates/index.ts"
verify_jwt = true  # explícito: la llama el CRM autenticado, igual que whatsapp-send
